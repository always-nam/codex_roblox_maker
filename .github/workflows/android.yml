name: Build Android preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run build:mobile
      - run: ./gradlew --no-daemon --max-workers=4 :app:assembleDebug :app:bundleRelease :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: playcraft-android-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.*
